# Imported by PaymentConfig; environment variables may be provided at deployment.
# Credential-free startup is supported. No demo gateway fallback.
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:}
payment.vnpay.enabled-bank-codes=${VNPAY_ENABLED_BANK_CODES:}
payment.vnpay.expiry-minutes=${VNPAY_EXPIRY_MINUTES:15}
payment.vnpay.server-ip=${VNPAY_SERVER_IP:127.0.0.1}
# Sandbox merchants may not support direct VNPAYQR/VNBANK routing. Let the
# hosted page offer the methods available for this merchant by default.
# Set false only after confirming direct routing is enabled for the merchant.
payment.vnpay.sandbox-omit-bank-code=${VNPAY_SANDBOX_OMIT_BANK_CODE:true}
