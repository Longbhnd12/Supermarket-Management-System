# UC45 - Forgot Password: Gmail SMTP used to send the password reset code.
# Imported by MailConfig. NEVER write the real Gmail address / App Password here:
# set them as environment variables on your own machine (see the PR description):
#   MAIL_USERNAME = the Gmail address that sends the codes
#   MAIL_PASSWORD = its 16-character Google "App Password" (not the normal Gmail password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Do not let an unreachable mail server block the request forever
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Name shown as the sender of the email
sms.mail.from-name=${MAIL_FROM_NAME:Supermarket Management System}
