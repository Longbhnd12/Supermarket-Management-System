# Only the signed VNPay GET callback is exposed. All other backend routes stay local.
on_http_request:
  - expressions:
      - "req.url.path != '/api/v1/payments/vnpay/ipn' || req.method != 'GET'"
    actions:
      - type: custom-response
        config:
          status_code: 404
          content: "Not found"
          headers:
            content-type: text/plain
