# JWT authentication (SDD 4.2.1.2.5). Imported by JwtConfig.
# The token is sent in an HttpOnly cookie, never readable by JavaScript.
#
# JWT_SECRET: at least 32 characters. NEVER commit the real value; set it as an environment variable.
#   If it is not set, a random key is generated at startup (everyone is logged out when the backend restarts).
sms.jwt.secret=${JWT_SECRET:}
# Name of the auth cookie
sms.jwt.cookie-name=SMS_AUTH
# true when the site is served over HTTPS (production). Must stay false on http://localhost.
sms.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
