# Gmail SMTP used to send emails:
#   UC45 - Forgot Password: the password reset code
#   UC05 - Manage Users: the login details (username + temporary password) of a new account
# Imported by MailConfig. NEVER write the real Gmail address / App Password here:
# set them as environment variables on your own machine (see the PR description):
#   MAIL_USERNAME = the Gmail address that sends the codes
#   MAIL_PASSWORD = its 16-character Google "App Password" (not the normal Gmail password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Do not let an unreachable mail server block the request forever
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Name shown as the sender of the email
sms.mail.from-name=${MAIL_FROM_NAME:Supermarket Management System}

# Sign-in link written in the "new account" email (UC05)
sms.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}
